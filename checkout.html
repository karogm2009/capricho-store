<!doctype html><html lang="es-CO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | CAPRICHO STORE</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/checkout.css"></head><body><div id="site-header"></div><main class="section"><div class="container"><p class="eyebrow">Checkout</p><h1 class="section-title">Finaliza tu capricho</h1><div class="checkout-layout"><form id="checkout-form" class="panel"><div class="form-grid"><div class="field"><label for="name">Nombre</label><input id="name" name="name" required autocomplete="name"></div><div class="field"><label for="phone">Teléfono</label><input id="phone" name="phone" required autocomplete="tel"></div><div class="field full"><label for="delivery">Tipo de entrega</label><select id="delivery" name="delivery" required><option value="pickup">Recogida</option><option value="delivery">Domicilio</option></select></div><div id="address-fields" class="field full" hidden><div class="form-grid"><div class="field"><label for="address">Dirección</label><input id="address" name="address"></div><div class="field"><label for="neighborhood">Barrio</label><input id="neighborhood" name="neighborhood"></div><div class="field"><label for="city">Ciudad</label><input id="city" name="city" value="Palmira"></div></div></div><div class="field full"><label for="notes">Notas</label><textarea id="notes" name="notes"></textarea></div></div><button class="btn" type="submit">CONFIRMAR PEDIDO</button><p id="checkout-message" class="muted"></p></form><aside id="checkout-summary" class="panel"></aside></div></div></main><div id="site-footer"></div><script type="module" src="js/checkout.js"></script></body></html>
